name: Backup diario Quimicer

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia as 03:00 (horario de Brasilia)
  workflow_dispatch: {}    # permite rodar manualmente

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJ: bcvlbqqoubeyxxuvkipf
    steps:
      - name: Baixar os fontes do sistema
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Etapa 4 - Copia do banco (pg_dump)
        env:
          PGPASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          BIN=/usr/lib/postgresql/17/bin
          D=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          mkdir -p out
          HOST=""
          P=$(printf '%s\n' "$PGPASSWORD" | tr -d '\r' | grep -E '^[A-Za-z0-9]{32}$' | head -1 || true)
          [ -n "$P" ] && export PGPASSWORD="$P"
          echo "Tamanho da senha usada: ${#PGPASSWORD} caracteres"
          for H in aws-1-sa-east-1.pooler.supabase.com aws-0-sa-east-1.pooler.supabase.com; do
            if OUT=$($BIN/psql "host=$H port=5432 dbname=postgres user=backup_ro.$PROJ sslmode=require connect_timeout=15" -Atc "select 1" 2>&1); then HOST=$H; break; else echo "$H -> $(echo "$OUT" | tail -1)"; fi
          done
          [ -n "$HOST" ] || { echo "::error::Nao conectou no banco"; exit 1; }
          echo "Conectado via $HOST"
          echo "PGCONN=host=$HOST port=5432 dbname=postgres user=backup_ro.$PROJ sslmode=require" >> $GITHUB_ENV
          CONN="host=$HOST port=5432 dbname=postgres user=backup_ro.$PROJ sslmode=require"
          # 1) Estrutura + dados do sistema (schemas public e backup, sem as copias internas antigas)
          $BIN/pg_dump "$CONN" --no-owner --no-privileges -n public -n backup \
            --exclude-table-data=backup.copias -f out/banco_sistema.sql
          # 2) Dados de usuarios (login) e indice dos arquivos anexados
          $BIN/pg_dump "$CONN" --data-only --no-owner --no-privileges \
            -t auth.users -t auth.identities -t storage.buckets -t storage.objects -f out/banco_usuarios_arquivos.sql
          # 3) Conferencia: contagem de linhas por tabela
          $BIN/psql "$CONN" -Atc "select relname||';'||n_live_tup from pg_stat_user_tables where schemaname='public' order by 1" > out/contagem.txt || true
          $BIN/psql "$CONN" -AtF';' -c "select 'registros',count(*) from public.registros union all select 'laudos',count(*) from public.laudos union all select 'itens',count(*) from public.itens union all select 'rnc',count(*) from public.rnc" > out/conferencia.txt
          gzip -9 out/*.sql
          ls -la out
          echo "--- Conferencia (linhas) ---"; cat out/conferencia.txt
          # teste de integridade: o arquivo precisa ter as tabelas principais
          for T in registros laudos itens perfis rnc; do
            zgrep -q "CREATE TABLE public.$T " out/banco_sistema.sql.gz || { echo "::error::Tabela $T ausente no dump"; exit 1; }
          done
          echo "DUMP_OK $D"

      - name: Instalar e configurar rclone (Google Drive)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || true
          rclone version | head -1
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" | tr -d '\r' > ~/.config/rclone/rclone.conf
          grep -q '^\[gdrive\]' ~/.config/rclone/rclone.conf || { echo "::error::RCLONE_CONF sem a secao [gdrive]"; exit 1; }
          rclone lsd "gdrive:Backup Quimicer" >/dev/null && echo "Drive OK"

      - name: Etapa 5 - PDFs anexados (espelho no Drive)
        env:
          PGPASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          P=$(printf '%s\n' "$PGPASSWORD" | tr -d '\r' | grep -E '^[A-Za-z0-9]{32}$' | head -1 || true)
          [ -n "$P" ] && export PGPASSWORD="$P"
          DEST="gdrive:Backup Quimicer/arquivos/laudos-mp"
          /usr/lib/postgresql/17/bin/psql "$PGCONN" -Atc "select name||'|'||coalesce(metadata->>'size','0') from storage.objects where bucket_id='laudos-mp' and name not like '%/.emptyFolderPlaceholder' order by name" > out/objetos.txt
          rclone lsf -R --files-only --format ps --separator '|' "$DEST" > remoto.txt 2>/dev/null || : > remoto.txt
          python3 - <<'PY'
          import os, json, urllib.request, pathlib, concurrent.futures as cf
          key = os.environ['PGPASSWORD']
          url = 'https://' + os.environ['PROJ'] + '.supabase.co/functions/v1/backup-arquivos'
          objs = [l.rstrip('\n').rsplit('|', 1) for l in open('out/objetos.txt') if '|' in l]
          rem = dict(l.rstrip('\n').rsplit('|', 1) for l in open('remoto.txt') if '|' in l)
          falt = [n for n, s in objs if rem.get(n) != s]
          print(f'{len(objs)} arquivos no Supabase; {len(rem)} ja no Drive; {len(falt)} novos/alterados para copiar')
          def sign(paths):
              r = urllib.request.Request(url, data=json.dumps({'bucket': 'laudos-mp', 'paths': paths}).encode(),
                                         headers={'x-backup-key': key, 'content-type': 'application/json'})
              return json.load(urllib.request.urlopen(r, timeout=60))
          def get(it):
              p = pathlib.Path('dl') / it['path']; p.parent.mkdir(parents=True, exist_ok=True)
              err = None
              for _ in range(3):
                  try:
                      with urllib.request.urlopen(it['url'], timeout=120) as r: p.write_bytes(r.read())
                      return 1
                  except Exception as e: err = e
              print('ERRO', it['path'], err); return 0
          ok = erros = 0
          for i in range(0, len(falt), 100):
              lote = sign(falt[i:i + 100])
              boas = [x for x in lote if x.get('url')]
              with cf.ThreadPoolExecutor(8) as ex: res = list(ex.map(get, boas))
              ok += sum(res); erros += len(lote) - sum(res)
          print(f'Baixados: {ok}  Erros: {erros}')
          open('out/arquivos_resumo.txt', 'w').write(f'{len(objs)};{ok};{erros}\n')
          if erros: raise SystemExit(1)
          PY
          if [ -d dl ]; then rclone copy dl "$DEST" --transfers 8 --stats-one-line --stats 30s; fi
          echo "Conferencia no Drive: $(rclone lsf -R --files-only "$DEST" | wc -l) arquivos"
          echo "PDFS_OK"

      - name: Etapa 6 - Fontes do sistema (zip)
        run: |
          set -euo pipefail
          D=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          cd src
          git archive --format=zip -9 -o "../out/fontes_$D.zip" HEAD
          cp .github/scripts/ROTEIRO_RESTAURACAO.md ../out/ 2>/dev/null || true
          echo "Commit: $(git log -1 --format='%h %ci %s')" > ../out/fontes_versao.txt
          cd ..
          N=$(unzip -l "out/fontes_$D.zip" | tail -1 | awk '{print $2}')
          unzip -l "out/fontes_$D.zip" | grep ' index.html$' >/dev/null || { echo "::error::index.html ausente nos fontes"; exit 1; }
          ls -la "out/fontes_$D.zip"; cat out/fontes_versao.txt
          echo "FONTES_OK ($N arquivos)"

      - name: Etapa 7 - Planilhas Excel FR 001, FR 002 e FR 011
        env:
          PGPASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          P=$(printf '%s\n' "$PGPASSWORD" | tr -d '\r' | grep -E '^[A-Za-z0-9]{32}$' | head -1 || true)
          [ -n "$P" ] && export PGPASSWORD="$P"
          pip install --quiet openpyxl
          mkdir -p json out/excel
          Q() { /usr/lib/postgresql/17/bin/psql "$PGCONN" -Atc "select coalesce(json_agg(t),'[]') from ($1) t" > "json/$2"; }
          Q "select modulo,id,dados from public.itens" itens.json
          Q "select id,modulo,mes,origem,ordem,dados from public.registros" registros.json
          Q "select id,dados from public.lotes_mp" lotes.json
          Q "select chave,dados from public.config" config.json
          python3 src/.github/scripts/gerar_excel.py json out/excel
          ls -la out/excel
          [ "$(ls out/excel/*.xlsx | wc -l)" = "3" ] || { echo "::error::Faltou alguma planilha"; exit 1; }
          echo "EXCEL_OK"

      - name: Etapa 8 - Enviar ao Drive e manter as 5 ultimas copias
        run: |
          set -euo pipefail
          D=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          Z="backup_quimicer_$D.zip"
          (cd out && zip -r -9 -q "../$Z" .)
          unzip -t "$Z" >/dev/null && echo "Pacote integro: $Z ($(du -h "$Z" | cut -f1))"
          unzip -l "$Z" | tail -n +4 | head -n -2
          DEST="gdrive:Backup Quimicer/copias"
          rclone copyto "$Z" "$DEST/$Z"
          rclone lsf "$DEST" --files-only --include "backup_quimicer_*.zip" | sort > lista.txt
          grep -qx "$Z" lista.txt || { echo "::error::Pacote nao apareceu no Drive"; exit 1; }
          N=$(wc -l < lista.txt)
          if [ "$N" -gt 5 ]; then
            head -n $((N-5)) lista.txt | while read -r f; do rclone deletefile "$DEST/$f" && echo "Copia antiga removida: $f"; done
          fi
          rclone purge "gdrive:Backup Quimicer/teste" >/dev/null 2>&1 || true
          echo "Copias guardadas no Drive:"; rclone lsl "$DEST" --include "backup_quimicer_*.zip"
          echo "$Z ($(du -h "$Z" | cut -f1))" > zipinfo.txt
          echo "DRIVE_OK"

      - name: Teste de restauracao (domingos e execucoes manuais)
        run: |
          set -euo pipefail
          DOW=$(TZ=America/Sao_Paulo date +%u)
          if [ "$DOW" != "7" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "Hoje nao e domingo - teste de restauracao pulado"; exit 0; fi
          BIN=/usr/lib/postgresql/17/bin
          docker run -d --name pgteste -e POSTGRES_PASSWORD=teste -p 5433:5432 postgres:17 >/dev/null
          export PGPASSWORD=teste
          T="host=localhost port=5433 user=postgres dbname=postgres"
          for i in $(seq 1 40); do $BIN/psql "$T" -Atc 'select 1' >/dev/null 2>&1 && break; sleep 2; done
          $BIN/psql "$T" -q -c "create role anon; create role authenticated; create role service_role; create schema auth; create schema extensions; create function auth.uid() returns uuid language sql as 'select null::uuid'; create function auth.role() returns text language sql as 'select null::text'; create function auth.jwt() returns jsonb language sql as 'select null::jsonb';"
          zcat out/banco_sistema.sql.gz | $BIN/psql "$T" -q > restore.log 2>&1 || true
          ERR=$(grep -c ERROR restore.log || true)
          echo "Avisos na restauracao: $ERR (esperados: recursos exclusivos do Supabase, como cron e permissoes)"
          $BIN/psql "$T" -AtF';' -c "select 'registros',count(*) from public.registros union all select 'laudos',count(*) from public.laudos union all select 'itens',count(*) from public.itens union all select 'rnc',count(*) from public.rnc" > restaurado.txt
          echo "--- Banco original ---"; cat out/conferencia.txt
          echo "--- Banco restaurado ---"; cat restaurado.txt
          if diff -q out/conferencia.txt restaurado.txt >/dev/null; then echo "RESTAURACAO_OK"; else echo "::error::Restauracao com contagem diferente"; grep ERROR restore.log | head -20; exit 1; fi
          docker rm -f pgteste >/dev/null

      - name: Etapa 9 - E-mail diario com as planilhas
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 src/.github/scripts/enviar_email.py ok

      - name: Aviso de falha por e-mail
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -f src/.github/scripts/enviar_email.py ]; then python3 src/.github/scripts/enviar_email.py falha; fi
